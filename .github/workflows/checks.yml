name: ITSOSCup checks
on:
  push:
    branches: [main, feat/offline-registrations-notices-analytics]
  pull_request:
    branches: [main]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: JavaScript syntax
        run: npm run check:js
      # Legacy static checks depend on sql/ and supabase/ files omitted from GitHub.
      - name: Inline page module syntax
        run: npm run check:inline
      - name: Innovation analytics tests
        run: npm run test:innovation
