<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ITSOSCup — applicazione Windows</title>
  <link rel="stylesheet" href="/shell.css">
  <script src="/shell.js" defer></script>
</head>
<body>
  <header class="desktop-bar">
    <div class="desktop-brand" aria-label="ITSOSCup Platform">
      <img src="/favicon.svg" width="28" height="28" alt="">
      <strong>ITSOSCup</strong><span>Windows</span>
    </div>
    <nav aria-label="Navigazione applicazione">
      <button id="open-platform" type="button" aria-pressed="true" title="Dashboard e menu identici al sito ITSOSCup">Gestione</button>
      <button id="open-site" type="button" aria-pressed="false" title="Pagina iniziale del sito ITSOSCup">Sito pubblico</button>
      <button id="open-key" type="button" aria-pressed="false" title="Partite e firme senza rete">Postazione offline</button>
    </nav>
    <div class="desktop-utilities">
      <button id="open-archive" type="button" title="Sblocca, proteggi e salva l'archivio locale" aria-label="Gestisci archivio locale">Archivio locale</button>
      <button id="desktop-retry" class="desktop-retry" type="button" hidden>Riprova salvataggio</button>
    </div>
  </header>
</body>
</html>
