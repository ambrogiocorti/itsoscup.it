<!doctype html>
<html lang="it">
  <head>

    <meta name="robots" content="noindex" />

<link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f172a">
    <script>
      // Vecchi indirizzi sostituiti da /admin/: reindirizza mantenendo parametri e ancora.
      (function () {
        var legacy = ['/admin.html', '/admin/admin.html', '/admin/innovation.html'];
        var path = window.location.pathname.replace(/\/+$/, '');
        if (legacy.indexOf(path) !== -1) {
          window.location.replace('/admin/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1b33; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 480px; padding: 32px 24px; text-align: center; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { margin: 0 0 24px; color: #c9d3e6; line-height: 1.5; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 22px; border-radius: 999px; background: #f5c518; color: #0f1b33; font-weight: 700; text-decoration: none; }
    </style>
  </head>

    <main>
      <h1>Pagina non trovata</h1>
